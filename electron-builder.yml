appId: local.bolbeats.player
productName: BolBeats
# BolBeats: no version in the file name, so download links to the latest release never change
artifactName: ${productName}-${os}-${arch}.${ext}
electronVersion: 43.8.7
directories:
    buildResources: assets
files:
    - 'out/**/*'
    - 'package.json'
    # BolBeats: debugging maps are for development only (about 50 MB)
    - '!**/*.map'
# BolBeats: the app is in English; Electron ships 220 interface language packs otherwise (about 45 MB)
electronLanguages:
    - en
    - en_GB
    - hi
extraResources:
    - assets/**
    # BolBeats: the private on-device library server
    - from: resources/navidrome
      to: navidrome
asarUnpack:
    - resources/**
win:
    target:
        - target: zip
          arch:
              - x64
              - arm64
        - target: nsis
          arch:
              - x64
              - arm64
    icon: assets/icons/icon.ico

nsis:
    allowToChangeInstallationDirectory: true
    oneClick: false
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always

mac:
    # BolBeats: Apple Silicon only (that is the Mac it is built and tested on)
    target:
        - target: dmg
          arch:
              - arm64
    # BolBeats: the .icon format needs full Xcode (actool), so use the PNG
    icon: assets/icons/1024x1024.png
    type: distribution
    hardenedRuntime: false
    identity: '-'
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist
    gatekeeperAssess: false
    notarize: false
    extendInfo:
        NSAudioCaptureUsageDescription: 'System audio access is required for mpv visualizer capture in BolBeats'
        NSLocalNetworkUsageDescription: 'BolBeats runs its music library on this Mac and reaches it over the local network interface'

dmg:
    contents: [{ x: 130, y: 220 }, { x: 410, y: 220, type: link, path: /Applications }]

linux:
    target:
        - AppImage
        - deb
        - tar.xz
    category: AudioVideo;Audio;Player
    icon: assets/icons/icon.png
    artifactName: ${productName}-${os}-${arch}.${ext}

toolsets:
    appimage: '1.0.3'

npmRebuild: false
afterAllArtifactBuild: scripts/after-all-artifact-build.mjs
publish:
    provider: github
    owner: itsrocksome
    repo: bolbeats
    channel: latest
    releaseType: draft
